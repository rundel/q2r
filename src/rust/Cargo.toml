[package]
name = 'q2r'
publish = false
version = '0.1.0'
edition = '2024'
rust-version = '1.85'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'q2r'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
tree-sitter = '0.26'
streaming-iterator = '0.1'
hashlink = '0.11'
serde_json = '1'

[dependencies.pampa]
git = 'https://github.com/quarto-dev/q2'
rev = '890b37554adf9a4e1a7760e4a3087efcc0aa7643'
default-features = false

[dependencies.tree-sitter-qmd]
git = 'https://github.com/quarto-dev/q2'
rev = '890b37554adf9a4e1a7760e4a3087efcc0aa7643'

[dependencies.quarto-source-map]
version = '0.1.0'

[dependencies.quarto-error-reporting]
version = '0.2.1'

[profile.release]
lto = true
codegen-units = 1
