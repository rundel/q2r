url: https://rundel.github.io/q2r/

template:
  bootstrap: 5
  bootswatch: cosmo

home:
  title: q2r — R interface to the pampa Quarto parser
  description: >
    Parse QMD documents into the Pandoc AST or the tree-sitter
    concrete syntax tree, query and rewrite the result with a
    tidyselect-style or Lua-filter-style API, and render back to QMD.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

articles:
  - title: Working with the AST
    navbar: ~
    contents:
    - selecting-and-rewriting

reference:

  - title: Parsing and rendering
    desc: >
      Convert between QMD text/files and q2r's two AST representations,
      and render an AST back to QMD source.
    contents:
    - parse_qmd
    - to_qmd

  - title: Diagnostics
    desc: >
      Structured parse diagnostics emitted by the reader, plus the
      lazy text renderer used by `print()` / `format()`.
    contents:
    - pampa_diagnostic

  - title: Querying and rewriting the AST
    desc: >
      A predicate-driven query/rewrite vocabulary shared across both
      the Pandoc S7 AST and the tree-sitter AST.

  - subtitle: Locating nodes
    desc: >
      tidyselect-style verbs for locating nodes by predicate.
      Predicates are unquoted expressions evaluated against a per-node
      data mask that exposes slot names and helpers (`is()`,
      `has_class()`, `has_id()`, `has_attr()`, `is_leaf()`, ...).
    contents:
    - select_nodes
    - walk_nodes

  - subtitle: Mutating nodes
    desc: >
      Predicate-driven mutation verbs. Each return value is a node, a
      list of nodes (splice), or `NULL` (delete). The walker is
      post-order, matching Pandoc Lua filters' default.
    contents:
    - map_nodes
    - replace_nodes
    - splice_nodes
    - delete_nodes
    - insert_before
    - insert_after

  - subtitle: Filter-table rewriting (Lua-filter-style)
    desc: >
      `ast_filter()` rewrites multiple node types in one pass using a
      table of S7-class-keyed handlers, with optional top-down
      traversal and list-level dispatch on `pandoc_inlines` /
      `pandoc_blocks`. `ast_text()` flattens a subtree to plain text.
    contents:
    - ast_filter
    - ast_skip
    - ast_text

  - title: Attribute helpers
    desc: >
      Concise immutable getters and setters for the `@attr` slot
      (id, classes, key-value attributes) found on headers, divs,
      code, links, spans, and friends.
    contents:
    - has_class
    - add_class
    - remove_class
    - get_id
    - set_id
    - get_attr
    - set_attr

  - title: Constructing content
    desc: >
      Ergonomic coercion helpers that accept strings, single nodes,
      or lists and produce the canonical `pandoc_inlines` /
      `pandoc_blocks` wrappers.
    contents:
    - as_inlines
    - as_blocks

  - title: Tables
    desc: >
      Convert between a `pandoc_table` and a `data.frame`: flatten a
      parsed table to columns, or build a renderable table from a data
      frame (alignment, caption, and id ride along as attributes).
    contents:
    - table_df

  - title: Tree-sitter queries
    desc: >
      Raw tree-sitter `.scm` query escape hatch with capture support,
      for cases where the predicate API is not expressive enough.
    contents:
    - ts_query

  - title: Pandoc AST
    desc: >
      The S7 class hierarchy returned by `parse_qmd()` (the default
      `ast = "pd"`) and accepted by `to_qmd()`.

  - subtitle: Root and abstract classes
    desc: >
      `pandoc` is the document root and `pandoc_node` the common
      ancestor for every concrete node (with the abstract
      `pandoc_block` / `pandoc_inline` parents). `pandoc_blocks` /
      `pandoc_inlines` are the strict-typed list wrappers used in
      content slots. `pandoc_children` / `pandoc_format_label` are the
      generics behind the tree display, which `print.pandoc` documents.
    contents:
    - pandoc
    - pandoc_node
    - pandoc_blocks
    - pandoc_children
    - pandoc_format_label
    - print.pandoc

  - subtitle: Block constructors
    desc: >
      Constructors for the concrete block-level node classes, collected
      on a single page (one alias and usage entry per constructor).
    contents:
    - pandoc_block_constructors

  - subtitle: Inline constructors
    desc: >
      Constructors for the concrete inline node classes, collected on a
      single page (one alias and usage entry per constructor).
    contents:
    - pandoc_inline_constructors

  - subtitle: Support types
    desc: >
      Helper types that appear inside concrete nodes: attributes,
      table substructures, citations, captions, metadata.
    contents:
    - pandoc_support_types
    - pandoc_table_head
    - pandoc_meta_value

  - title: Tree-sitter AST
    desc: >
      S7 classes for the tree-sitter concrete syntax tree returned by
      `parse_qmd(ast = "ts")`. The tree is structurally faithful to the
      source bytes; use it when `to_qmd()` round-trip equivalence
      matters. `print.ts_tree` documents the tree display and its
      `position` / `ascii` knobs.
    contents:
    - ts_tree
    - ts_node
    - ts_nodes
    - ts_point
    - ts_range
    - print.ts_tree

footer:
  structure:
    left: developed_by
    right: built_with
