url: https://rundel.github.io/q2r/

template:
  bootstrap: 5
  bootswatch: cosmo

home:
  title: q2r — R interface to the pampa Quarto parser
  description: >
    Parse QMD documents into the Pandoc AST or the tree-sitter
    concrete syntax tree, query and rewrite the result with a
    tidyselect-style or Lua-filter-style API, and render back to QMD.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

articles:
  - title: Working with the AST
    navbar: ~
    contents:
    - selecting-and-rewriting

reference:

  - title: Parsing and rendering
    desc: >
      Convert between QMD text/files and q2r's two AST representations,
      and render an AST back to QMD source.
    contents:
    - parse_qmd
    - to_qmd

  - title: Diagnostics
    desc: >
      Structured parse diagnostics emitted by the reader, plus the
      lazy text renderer used by `print()` / `format()`.
    contents:
    - pampa_diagnostic

  - title: Querying the AST
    desc: >
      tidyselect-style verbs for locating nodes by predicate. Works
      on both the Pandoc S7 AST and the tree-sitter AST. Predicates
      are unquoted expressions evaluated against a per-node data mask
      that exposes slot names and helpers (`is()`, `has_class()`,
      `has_id()`, `has_attr()`, `is_leaf()`, ...).
    contents:
    - select_nodes
    - walk_nodes

  - title: Rewriting the AST
    desc: >
      Predicate-driven mutation verbs. Each return value is a node, a
      list of nodes (splice), or `NULL` (delete). The walker is
      post-order, matching Pandoc Lua filters' default.
    contents:
    - map_nodes
    - replace_nodes
    - splice_nodes
    - delete_nodes
    - insert_before
    - insert_after

  - title: Filter-table rewriting (Lua-filter-style)
    desc: >
      `ast_filter()` rewrites multiple node types in one pass using a
      table of S7-class-keyed handlers, with optional top-down
      traversal and list-level dispatch on `pandoc_inlines` /
      `pandoc_blocks`. `ast_text()` flattens a subtree to plain text.
    contents:
    - ast_filter
    - ast_skip
    - ast_text

  - title: Attribute helpers
    desc: >
      Concise immutable getters and setters for the `@attr` slot
      (id, classes, key-value attributes) found on headers, divs,
      code, links, spans, and friends.
    contents:
    - has_class
    - add_class
    - remove_class
    - get_id
    - set_id
    - get_attr
    - set_attr
    - remove_attr

  - title: Constructing content
    desc: >
      Ergonomic coercion helpers that accept strings, single nodes,
      or lists and produce the canonical `pandoc_inlines` /
      `pandoc_blocks` wrappers.
    contents:
    - as_inlines
    - as_blocks

  - title: Tree-sitter queries
    desc: >
      Raw tree-sitter `.scm` query escape hatch with capture support,
      for cases where the predicate API is not expressive enough.
    contents:
    - ts_query

  - title: Pandoc AST — root and abstract classes
    desc: >
      The S7 class hierarchy. `pandoc` is the document root,
      `pandoc_node` the common ancestor for every concrete node, and
      `pandoc_block` / `pandoc_inline` the abstract block/inline
      parents. `pandoc_blocks` / `pandoc_inlines` are the strict-typed
      list wrappers used in content slots. `print.pandoc` documents
      the tree display and its `position` / `ascii` knobs.
    contents:
    - pandoc
    - pandoc_node
    - pandoc_block
    - pandoc_inline
    - pandoc_blocks
    - pandoc_inlines
    - pandoc_children
    - print.pandoc

  - title: Pandoc AST — block constructors
    contents:
    - pandoc_plain
    - pandoc_paragraph
    - pandoc_header
    - pandoc_block_quote
    - pandoc_div
    - pandoc_code_block
    - pandoc_raw_block
    - pandoc_ordered_list
    - pandoc_bullet_list
    - pandoc_line_block
    - pandoc_definition_list
    - pandoc_definition_item
    - pandoc_figure
    - pandoc_horizontal_rule
    - pandoc_caption_block
    - pandoc_block_metadata
    - pandoc_note_definition_para
    - pandoc_note_definition_fenced_block
    - pandoc_custom_block

  - title: Pandoc AST — inline constructors
    contents:
    - pandoc_str
    - pandoc_space
    - pandoc_soft_break
    - pandoc_line_break
    - pandoc_emph
    - pandoc_underline
    - pandoc_strong
    - pandoc_strikeout
    - pandoc_superscript
    - pandoc_subscript
    - pandoc_small_caps
    - pandoc_quoted
    - pandoc_cite
    - pandoc_code
    - pandoc_math
    - pandoc_raw_inline
    - pandoc_link
    - pandoc_image
    - pandoc_note
    - pandoc_span
    - pandoc_shortcode
    - pandoc_insert
    - pandoc_delete
    - pandoc_highlight
    - pandoc_edit_comment
    - pandoc_note_reference
    - pandoc_attr_inline
    - pandoc_custom_inline

  - title: Pandoc AST — support types
    desc: >
      Helper types that appear inside concrete nodes: attributes,
      table substructures, citations, captions, metadata.
    contents:
    - pandoc_attr
    - pandoc_caption
    - pandoc_citation
    - pandoc_table
    - pandoc_table_head
    - pandoc_table_body
    - pandoc_table_foot
    - pandoc_row
    - pandoc_cell
    - pandoc_col_spec
    - pandoc_list_attributes
    - pandoc_format_label
    - pandoc_meta_value
    - pandoc_config_value
    - pandoc_source_info

  - title: Tree-sitter AST
    desc: >
      S7 classes for the tree-sitter concrete syntax tree returned by
      `parse_qmd(ast = "ts")`. The tree is structurally faithful to the
      source bytes; use it when `to_qmd()` round-trip equivalence
      matters. `print.ts_tree` documents the tree display and its
      `position` / `ascii` knobs.
    contents:
    - ts_tree
    - ts_node
    - ts_nodes
    - ts_point
    - ts_range
    - print.ts_tree

footer:
  structure:
    left: developed_by
    right: built_with
